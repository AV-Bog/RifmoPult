name: Android CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Сборка и модульные тесты
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: RifmoPult

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Настройка JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Права на gradlew
        run: chmod +x gradlew

      - name: Установка нужных пакетов SDK
        run: |
          sdkmanager --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Модульные тесты
        run: ./gradlew --no-daemon --stacktrace testDebugUnitTest

      - name: Отчёт о тестах
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: RifmoPult/app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore

      - name: Сборка debug APK
        run: ./gradlew --no-daemon --stacktrace assembleDebug

      - name: Артефакт APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: RifmoPult/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
